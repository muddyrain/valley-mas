name: Quality

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Harness, Check, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toolchain consistency
        run: node scripts/check-toolchain-consistency.mjs

      - name: Test toolchain checker
        run: node --test scripts/check-toolchain-consistency.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check agent harness
        run: pnpm check:harness

      - name: Check agents context entry
        run: pnpm check:agents-context

      - name: Test agents context checker
        run: pnpm check:agents-context:test

      - name: Check plans index
        run: pnpm check:plans-index

      - name: Check workspace
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Test Web
        run: pnpm --filter @valley/web test

      - name: Check Web Coverage Surface
        run: pnpm --filter @valley/web check:coverage-surface

      - name: Test Web Coverage Gate
        run: pnpm --filter @valley/web test:cov

  server:
    name: Go Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test server
        run: go test ./...
